# API gateway for auth/shortener/analytics. Client traffic only —
# service-to-service calls bypass this and go container-to-container
# directly (they use X-Internal-Token, not a JWT, so auth_request below
# gives them nothing). Bind-mounted as default.conf.template so it
# replaces nginx's own demo default.conf instead of running alongside it.

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # auth_request target only. Forces GET + drops the body (subrequests
    # never carry one); token travels via Authorization header instead.
    location = /internal/verify {
        internal;
        set $auth_verify http://auth:8000;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host auth;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Internal-Token "${INTERNAL_SERVICE_TOKEN}";
        proxy_pass $auth_verify/api/v1/auth/internal/token/validate/;
    }

    # auth_request treats both 401 and 403 as a valid denial.
    error_page 401 403 = @unauthorized;

    location @unauthorized {
        default_type application/json;
        return 401 '{"detail": "Authentication credentials were not provided or are invalid."}';
    }

    location /api/v1/auth/ {
        set $auth_service http://auth:8000;
        proxy_pass $auth_service$request_uri;
    }

    # Every service actually serves its docs/schema at the same literal
    # /docs/ and /api/schema/ paths (see each service's Config/urls.py), so
    # these give each an unambiguous address from the gateway
    # (/api/v1/docs/<service>/, /api/v1/schema/<service>/) and rewrite back
    # to the real, unprefixed path before proxying. sub_filter patches
    # Swagger UI's embedded (root-relative) schema fetch to point at the
    # gateway's own prefixed schema route instead; Accept-Encoding "" is
    # required since sub_filter can't match inside gzip.
    location /api/v1/docs/auth/ {
        set $auth_docs http://auth:8000;
        rewrite ^/api/v1/docs/auth/(.*)$ /docs/$1 break;
        proxy_set_header Accept-Encoding "";
        sub_filter '/api/schema/' '/api/v1/schema/auth/';
        sub_filter_once off;
        proxy_pass $auth_docs;
    }
    location /api/v1/schema/auth/ {
        set $auth_schema http://auth:8000;
        rewrite ^/api/v1/schema/auth/(.*)$ /api/schema/$1 break;
        proxy_pass $auth_schema;
    }
    location /api/v1/docs/shortener/ {
        set $shortener_docs http://shortener:8000;
        rewrite ^/api/v1/docs/shortener/(.*)$ /docs/$1 break;
        proxy_set_header Accept-Encoding "";
        sub_filter '/api/schema/' '/api/v1/schema/shortener/';
        sub_filter_once off;
        proxy_pass $shortener_docs;
    }
    location /api/v1/schema/shortener/ {
        set $shortener_schema http://shortener:8000;
        rewrite ^/api/v1/schema/shortener/(.*)$ /api/schema/$1 break;
        proxy_pass $shortener_schema;
    }
    location /api/v1/docs/analytics/ {
        set $analytics_docs http://analytics:8000;
        rewrite ^/api/v1/docs/analytics/(.*)$ /docs/$1 break;
        proxy_set_header Accept-Encoding "";
        sub_filter '/api/schema/' '/api/v1/schema/analytics/';
        sub_filter_once off;
        proxy_pass $analytics_docs;
    }
    location /api/v1/schema/analytics/ {
        set $analytics_schema http://analytics:8000;
        rewrite ^/api/v1/schema/analytics/(.*)$ /api/schema/$1 break;
        proxy_pass $analytics_schema;
    }

    # Django admin, one per service (same /admin/ path on all three, so each
    # needs its own gateway prefix, same idea as docs/schema above). Caveat:
    # Django generates its own admin links (redirects, "view on site",
    # pagination, breadcrumbs) root-relative to /admin/ — it has no idea it's
    # mounted behind a prefix here — so only this entry location itself is
    # guaranteed to route correctly; following an in-page link lands back at
    # plain /admin/, which some *other* location here will catch, not
    # necessarily this same service. Fine for a quick login/lookup; for real
    # admin work, use the service's own port directly.
    location /admin/auth/ {
        set $auth_admin http://auth:8000;
        rewrite ^/admin/auth/(.*)$ /admin/$1 break;
        proxy_pass $auth_admin;
    }
    location /admin/shortener/ {
        set $shortener_admin http://shortener:8000;
        rewrite ^/admin/shortener/(.*)$ /admin/$1 break;
        proxy_pass $shortener_admin;
    }
    location /admin/analytics/ {
        set $analytics_admin http://analytics:8000;
        rewrite ^/admin/analytics/(.*)$ /admin/$1 break;
        proxy_pass $analytics_admin;
    }

    # Health checks — url-service and analytics-service only (see each
    # Config/urls.py; auth-service has no /health/ route to proxy to).
    location /health/shortener/ {
        set $shortener_health http://shortener:8000;
        rewrite ^/health/shortener/(.*)$ /health/$1 break;
        proxy_pass $shortener_health;
    }
    location /health/analytics/ {
        set $analytics_health http://analytics:8000;
        rewrite ^/health/analytics/(.*)$ /health/$1 break;
        proxy_pass $analytics_health;
    }

    # Internal endpoints are called directly, service-to-service — never
    # exposed here.
    location /api/v1/internal/ {
        return 404;
    }
    location /internal/ {
        return 404;
    }

    location /api/v1/urls/ {
        auth_request /internal/verify;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_username $upstream_http_x_username;
        auth_request_set $auth_user_tier $upstream_http_x_user_tier;
        auth_request_set $auth_user_premium $upstream_http_x_user_is_premium;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-Username $auth_username;
        proxy_set_header X-User-Tier $auth_user_tier;
        proxy_set_header X-User-Is-Premium $auth_user_premium;

        set $shortener_service http://shortener:8000;
        proxy_pass $shortener_service$request_uri;
    }

    location /api/v1/analytics/ {
        auth_request /internal/verify;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_username $upstream_http_x_username;
        auth_request_set $auth_user_tier $upstream_http_x_user_tier;
        auth_request_set $auth_user_premium $upstream_http_x_user_is_premium;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-Username $auth_username;
        proxy_set_header X-User-Tier $auth_user_tier;
        proxy_set_header X-User-Is-Premium $auth_user_premium;

        set $analytics_service http://analytics:8000;
        proxy_pass $analytics_service$request_uri;
    }

    # Everything else on shortener: public JSON resolve, and the short
    # link itself (e.g. /abc123).
    location /api/v1/ {
        set $shortener_service http://shortener:8000;
        proxy_pass $shortener_service$request_uri;
    }
    location / {
        set $shortener_service http://shortener:8000;
        proxy_pass $shortener_service$request_uri;
    }
}
