services:
  gateway:
    image: nginx:1.25-alpine
    container_name: api_gateway
    ports:
      - "8080:80"
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    # nginx's own entrypoint envsubst's *.template files into conf.d before
    # starting — that's what lets ${INTERNAL_SERVICE_TOKEN} above reach
    # server.conf without baking it into an image.
    volumes:
      - ./server.conf:/etc/nginx/templates/default.conf.template:ro
    networks:
      - gateway-net

networks:
  gateway-net:
    external: true
    name: url_shortener_gateway
