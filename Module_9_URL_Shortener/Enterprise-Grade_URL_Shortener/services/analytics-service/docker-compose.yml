services:
  analytics-db:
    image: postgres:16-alpine
    container_name: analytics_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: analytics_service_redis
    ports:
      - "6381:6379"
    volumes:
      - analytics_redis_data:/data
    command: redis-server --appendonly yes

  analytics-service:
    build: .
    container_name: analytics_service
    command: sh -c "python manage.py migrate && gunicorn Config.wsgi:application --bind 0.0.0.0:8000"
    # No environment: block here — the Dockerfile's `COPY . .` bakes this
    # service's own .env straight into the image, and Django reads it
    # directly at startup (Config/settings.py). Docker itself needs nothing
    # from this container beyond what's already in the image.
    ports:
      - "8003:8000"
    depends_on:
      analytics-db:
        condition: service_healthy
      redis:
        condition: service_started
    # "default" keeps this reachable from analytics-db/redis above;
    # "gateway-net" is the network shared with the other services and the
    # gateway (see gateway/docker-compose.yml), under the alias the
    # gateway's server.conf expects. It's external, so it must exist before
    # this comes up — a one-time `docker network create url_shortener_gateway`,
    # same as copying .env.example once. This service is still fully usable
    # standalone (Swagger, admin, direct :8003 calls) whether or not the
    # gateway container itself is ever started.
    networks:
      default:
      gateway-net:
        aliases:
          - analytics

  celery-worker:
    build: .
    container_name: analytics_service_celery_worker
    command: celery -A Config worker -l info
    depends_on:
      analytics-db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  analytics_postgres_data:
  analytics_redis_data:

networks:
  gateway-net:
    external: true
    name: url_shortener_gateway
