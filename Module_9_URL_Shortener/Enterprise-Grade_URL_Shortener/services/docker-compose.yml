# Single orchestration file for the whole platform: every service's
# database/cache, the service itself, and the nginx gateway that fronts them
# all. Each service under this same services/ folder still only ships its
# own Dockerfile and .env/.env.example — this is the one place that wires
# them together and is the only supported way to run the full stack.
#
# Usage: `docker compose up --build` from services/.
services:
  # ---- auth-service ------------------------------------------------------
  auth-db:
    image: postgres:16-alpine
    container_name: auth_db
    env_file:
      - ./auth-service/.env
    ports:
      - "5434:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ so the container's own shell expands these (from env_file above),
      # not the host running `docker compose`.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build: ./auth-service
    container_name: auth_service
    command: sh -c "python manage.py migrate && gunicorn -c gunicorn.conf.py Config.wsgi:application"
    # No environment:/env_file: block — the Dockerfile's `COPY . .` bakes this
    # service's own .env straight into the image, and Django reads it
    # directly at startup (Config/settings.py).
    ports:
      - "127.0.0.1:8001:8000"  # local debugging only — real traffic goes through the gateway
    depends_on:
      auth-db:
        condition: service_healthy

  # ---- url-service (shortener) -------------------------------------------
  url-db:
    image: postgres:16-alpine
    container_name: url_db
    env_file:
      - ./url-service/.env
    ports:
      - "5436:5432"
    volumes:
      - url_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  url-redis:
    image: redis:7-alpine
    container_name: url_shortener_service_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  shortener:
    build: ./url-service
    container_name: url_service
    command: sh -c "python manage.py migrate && gunicorn -c gunicorn.conf.py Config.wsgi:application"
    ports:
      - "127.0.0.1:8002:8000"  # local debugging only — real traffic goes through the gateway
    depends_on:
      url-db:
        condition: service_healthy
      url-redis:
        condition: service_started

  url-celery-worker:
    build: ./url-service
    container_name: url_service_celery_worker
    command: celery -A Config worker -l info
    depends_on:
      url-db:
        condition: service_healthy
      url-redis:
        condition: service_started

  url-celery-beat:
    build: ./url-service
    container_name: url_service_celery_beat
    command: celery -A Config beat -l info
    depends_on:
      url-db:
        condition: service_healthy
      url-redis:
        condition: service_started

  # ---- analytics-service ---------------------------------------------------
  analytics-db:
    image: postgres:16-alpine
    container_name: analytics_db
    env_file:
      - ./analytics-service/.env
    ports:
      - "5435:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  analytics-redis:
    image: redis:7-alpine
    container_name: analytics_service_redis
    ports:
      - "6381:6379"
    volumes:
      - analytics_redis_data:/data
    command: redis-server --appendonly yes

  analytics:
    build: ./analytics-service
    container_name: analytics_service
    command: sh -c "python manage.py migrate && gunicorn -c gunicorn.conf.py Config.wsgi:application"
    ports:
      - "127.0.0.1:8003:8000"  # local debugging only — real traffic goes through the gateway
    depends_on:
      analytics-db:
        condition: service_healthy
      analytics-redis:
        condition: service_started

  analytics-celery-worker:
    build: ./analytics-service
    container_name: analytics_service_celery_worker
    command: celery -A Config worker -l info
    depends_on:
      analytics-db:
        condition: service_healthy
      analytics-redis:
        condition: service_started

  # ---- url-preview ----------------------------------------------------------
  url-preview-db:
    image: postgres:16-alpine
    container_name: url_preview_db
    env_file:
      # This .env carries both sets of names: DB_NAME/DB_USER/DB_PASSWORD
      # for Django (config/settings.py) and POSTGRES_DB/POSTGRES_USER/
      # POSTGRES_PASSWORD (same values) for this official postgres image,
      # which only recognizes its own POSTGRES_* names.
      - ./url-preview/.env
    ports:
      - "5437:5432"
    volumes:
      - url_preview_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  url-preview-redis:
    image: redis:7-alpine
    container_name: url_preview_redis
    ports:
      - "6382:6379"
    volumes:
      - url_preview_redis_data:/data
    command: redis-server --appendonly yes

  url-preview:
    build: ./url-preview
    container_name: url_preview_service
    command: sh -c "python manage.py migrate && gunicorn -c gunicorn.conf.py config.wsgi:application"
    ports:
      - "127.0.0.1:8004:8000"  # local debugging only — never routed through the gateway at all
    depends_on:
      url-preview-db:
        condition: service_healthy
      url-preview-redis:
        condition: service_started

  # ---- gateway -------------------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: url_shortener_gateway
    env_file:
      - ../gateway/.env
    volumes:
      # Mounted as default.conf.template (not nginx.conf.template) so the
      # base image's own envsubst entrypoint renders it to
      # /etc/nginx/conf.d/default.conf, replacing the demo server block
      # instead of running alongside it — see ../gateway/README.md. gateway/
      # lives at the repo root, alongside services/, not under services/
      # itself — it isn't a Django app with its own Dockerfile like the rest.
      - ../gateway/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "80:80"
    depends_on:
      - auth
      - shortener
      - analytics

volumes:
  auth_postgres_data:
  url_postgres_data:
  redis_data:
  analytics_postgres_data:
  analytics_redis_data:
  url_preview_postgres_data:
  url_preview_redis_data:
