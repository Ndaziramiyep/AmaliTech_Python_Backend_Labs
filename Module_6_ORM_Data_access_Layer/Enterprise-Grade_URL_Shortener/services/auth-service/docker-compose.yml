services:
  auth-db:
    image: postgres:16-alpine
    container_name: auth_db
    env_file:
      - .env
    ports:
      - "5434:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ so the container's own shell expands these (from env_file above),
      # not the host running `docker compose` — no root-level env needed.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: .
    container_name: auth_service
    command: sh -c "python manage.py migrate && gunicorn Config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      # Overrides only what must differ between a local run (values in .env)
      # and running inside the docker network.
      POSTGRES_HOST: auth-db
      POSTGRES_PORT: "5432"
    ports:
      - "8007:8000"
    depends_on:
      auth-db:
        condition: service_healthy

volumes:
  auth_postgres_data:
