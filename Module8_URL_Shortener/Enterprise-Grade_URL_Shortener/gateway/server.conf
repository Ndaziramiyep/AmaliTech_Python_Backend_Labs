# API gateway for auth/shortener/analytics. Client traffic only —
# service-to-service calls bypass this and go container-to-container
# directly (they use X-Internal-Token, not a JWT, so auth_request below
# gives them nothing). Bind-mounted as default.conf.template so it
# replaces nginx's own demo default.conf instead of running alongside it.

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # auth_request target only. Forces GET + drops the body (subrequests
    # never carry one); token travels via Authorization header instead.
    location = /internal/verify {
        internal;
        set $auth_verify http://auth:8000;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host auth;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Internal-Token "${INTERNAL_SERVICE_TOKEN}";
        proxy_pass $auth_verify/api/v1/auth/internal/token/validate/;
    }

    # auth_request treats both 401 and 403 as a valid denial.
    error_page 401 403 = @unauthorized;

    location @unauthorized {
        default_type application/json;
        return 401 '{"detail": "Authentication credentials were not provided or are invalid."}';
    }
}
