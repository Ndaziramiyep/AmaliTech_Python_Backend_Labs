services:
  analytics-db:
    image: postgres:16-alpine
    container_name: analytics_db
    env_file:
      - .env
    ports:
      - "5435:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  analytics-service:
    build: .
    container_name: analytics_service
    command: sh -c "python manage.py migrate && gunicorn Config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: analytics-db
      POSTGRES_PORT: "5432"
    ports:
      - "8006:8000"
    depends_on:
      analytics-db:
        condition: service_healthy

volumes:
  analytics_postgres_data:
