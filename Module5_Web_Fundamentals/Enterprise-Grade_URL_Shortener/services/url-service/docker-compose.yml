services:
  url-db:
    image: postgres:16-alpine
    container_name: url_db
    env_file:
      - .env
    ports:
      - "5436:5432"
    volumes:
      - url_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: url_shortener_service_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  url-service:
    build: .
    container_name: url_service
    command: sh -c "python manage.py migrate && gunicorn Config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: url-db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      # If analytics-service isn't part of this run (e.g. this file was
      # started standalone, not included from the root compose file),
      # click reporting just fails its request and logs a warning — see
      # url_shortener/clients/analytics_client.py. Redirects still work.
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
    ports:
      - "8005:8000"
    depends_on:
      url-db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  url_postgres_data:
  redis_data:
