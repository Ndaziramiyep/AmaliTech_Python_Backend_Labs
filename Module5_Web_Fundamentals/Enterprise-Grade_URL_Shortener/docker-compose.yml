services:
  auth-db:
    image: postgres:16-alpine
    container_name: auth_db
    env_file:
      - ./services/auth-service/.env
    ports:
      - "5434:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ so the shell inside the container expands these (from env_file
      # above), not docker compose on the host — no root-level env needed.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  url-db:
    image: postgres:16-alpine
    container_name: url_db
    env_file:
      - ./services/url-service/.env
    ports:
      - "5436:5432"
    volumes:
      - url_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  analytics-db:
    image: postgres:16-alpine
    container_name: analytics_db
    env_file:
      - ./services/analytics-service/.env
    ports:
      - "5435:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: url_shortener_service_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  auth-service:
    build: ./services/auth-service
    container_name: auth_service
    command: sh -c "python manage.py migrate && gunicorn Config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - ./services/auth-service/.env
    environment:
      # Overrides only what must differ between a local run (values in the
      # .env file above) and running inside the docker network.
      POSTGRES_HOST: auth-db
      POSTGRES_PORT: "5432"
    ports:
      - "8001:8000"
    depends_on:
      auth-db:
        condition: service_healthy

  url-service:
    build: ./services/url-service
    container_name: url_service
    command: sh -c "python manage.py migrate && gunicorn Config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - ./services/url-service/.env
    environment:
      POSTGRES_HOST: url-db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
    ports:
      - "8002:8000"
    depends_on:
      url-db:
        condition: service_healthy
      redis:
        condition: service_started

  analytics-service:
    build: ./services/analytics-service
    container_name: analytics_service
    command: sh -c "python manage.py migrate && gunicorn Config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - ./services/analytics-service/.env
    environment:
      POSTGRES_HOST: analytics-db
      POSTGRES_PORT: "5432"
    ports:
      - "8003:8000"
    depends_on:
      analytics-db:
        condition: service_healthy

volumes:
  auth_postgres_data:
  url_postgres_data:
  analytics_postgres_data:
  redis_data:
