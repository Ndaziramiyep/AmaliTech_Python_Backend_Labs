services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
    ports:
      # Host-side 5433 avoids clashing with a locally installed Postgres
      # service that may already own 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      # Host-side 6380 avoids clashing with a locally installed Redis-
      # compatible service (e.g. Memurai) that may already own 6379.
      - "6380:6379"
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:7
    ports:
      # Host-side 27018 avoids clashing with a locally installed Mongo
      # service that may already own 27017.
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  redis_data:
  mongo_data:
