services:
  redis:
    image: redis:7
    ports:
      # Host-side 6380 avoids clashing with a locally installed Redis-
      # compatible service (e.g. Memurai) that may already own 6379.
      - "6380:6379"
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:7
    ports:
      # Host-side 27018 avoids clashing with a locally installed Mongo
      # service that may already own 27017.
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  redis_data:
  mongo_data:
