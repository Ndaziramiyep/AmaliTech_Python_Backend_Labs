[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-platform-backend"
version = "1.0.0"
description = "Data backend for a social media platform: PostgreSQL, Redis, and MongoDB"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "pymongo>=4.6",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "C90"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["fakeredis.*", "mongomock.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not integration\" --cov=social_platform --cov-report=term-missing"
markers = [
    "integration: requires live docker-compose services (run with -m integration)",
]

[tool.coverage.run]
source = ["src/social_platform"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
