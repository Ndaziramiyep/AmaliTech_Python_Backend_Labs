[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social"
version = "0.1.0"
description = "Social media lab: Postgres + Redis + Mongo, clean architecture"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "pymongo>=4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
social-cli = "social.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
